basePath: /api
definitions:
  authSchemas.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  authSchemas.RegisterRequest:
    properties:
      email:
        type: string
      password:
        type: string
      username:
        type: string
    required:
    - email
    - password
    - username
    type: object
  authSchemas.SessionResponse:
    properties:
      expires_in:
        type: integer
    type: object
  projectSchemas.CreateProjectRequest:
    properties:
      title:
        type: string
    required:
    - title
    type: object
  projectSchemas.Project:
    properties:
      id:
        type: string
      title:
        type: string
      workspace_id:
        type: string
    type: object
  snapshotSchemas.UpsertSnapshotRequest:
    properties:
      state:
        description: base64
        type: string
    required:
    - state
    type: object
  workspaceSchemas.AddMemberRequest:
    properties:
      role:
        type: string
      user_id:
        type: string
    required:
    - role
    - user_id
    type: object
  workspaceSchemas.CreateWorkspaceRequest:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  workspaceSchemas.Workspace:
    properties:
      id:
        type: string
      name:
        type: string
      owner_id:
        type: string
    type: object
  workspaceSchemas.WorkspaceMember:
    properties:
      id:
        type: string
      role:
        type: string
      user_id:
        type: string
      workspace_id:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: This is the SyncTex backend API server.
  title: SyncTex API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Login user with email and password
      parameters:
      - description: User login data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/authSchemas.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/authSchemas.SessionResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login user
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Clear authentication cookie and logout user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Logout user
      tags:
      - auth
  /auth/refresh:
    post:
      description: Refresh access token using refresh token
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/authSchemas.SessionResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Refresh access token
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Register a new user with email, username and password
      parameters:
      - description: User registration data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/authSchemas.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register a new user
      tags:
      - auth
  /me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get current user profile
      tags:
      - user
  /projects/{id}:
    delete:
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: no content
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Delete project by id
      tags:
      - projects
    get:
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/projectSchemas.Project'
      security:
      - BearerAuth: []
      summary: Get project by id
      tags:
      - projects
  /projects/{id}/sessions:
    post:
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Start an editing session
      tags:
      - sessions
  /projects/{id}/snapshot:
    get:
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: binary
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Get latest snapshot for a project
      tags:
      - snapshots
    put:
      consumes:
      - application/json
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      - description: Snapshot
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/snapshotSchemas.UpsertSnapshotRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Save latest snapshot for a project (base64 in JSON)
      tags:
      - snapshots
  /sessions/{id}/end:
    post:
      parameters:
      - description: Session ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: End an editing session
      tags:
      - sessions
  /workspaces:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/workspaceSchemas.Workspace'
            type: array
      security:
      - BearerAuth: []
      summary: List my workspaces
      tags:
      - workspaces
    post:
      consumes:
      - application/json
      parameters:
      - description: Create workspace
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/workspaceSchemas.CreateWorkspaceRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/workspaceSchemas.Workspace'
      security:
      - BearerAuth: []
      summary: Create workspace
      tags:
      - workspaces
  /workspaces/{id}:
    get:
      parameters:
      - description: Workspace ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/workspaceSchemas.Workspace'
      security:
      - BearerAuth: []
      summary: Get workspace by id
      tags:
      - workspaces
  /workspaces/{id}/members:
    get:
      parameters:
      - description: Workspace ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/workspaceSchemas.WorkspaceMember'
            type: array
      security:
      - BearerAuth: []
      summary: List members in workspace
      tags:
      - workspaces
    post:
      consumes:
      - application/json
      parameters:
      - description: Workspace ID
        in: path
        name: id
        required: true
        type: string
      - description: Add member
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/workspaceSchemas.AddMemberRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/workspaceSchemas.WorkspaceMember'
      security:
      - BearerAuth: []
      summary: Add member to workspace
      tags:
      - workspaces
  /workspaces/{id}/projects:
    get:
      parameters:
      - description: Workspace ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/projectSchemas.Project'
            type: array
      security:
      - BearerAuth: []
      summary: List projects in a workspace
      tags:
      - projects
    post:
      consumes:
      - application/json
      parameters:
      - description: Workspace ID
        in: path
        name: id
        required: true
        type: string
      - description: Create project
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/projectSchemas.CreateProjectRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/projectSchemas.Project'
      security:
      - BearerAuth: []
      summary: Create project in a workspace
      tags:
      - projects
schemes:
- http
- https
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
