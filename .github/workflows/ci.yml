name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: synctex
          POSTGRES_PASSWORD: synctex
          POSTGRES_DB: synctex
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U synctex"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: apps/api/go.sum
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Repository hygiene
        working-directory: .
        run: ./scripts/check-hygiene.sh
      - name: Migrations apply to a clean database
        run: |
          go install github.com/pressly/goose/v3/cmd/goose@v3.26.0
          goose -dir migrations postgres "postgres://synctex:synctex@localhost:5432/synctex" up
          goose -dir migrations postgres "postgres://synctex:synctex@localhost:5432/synctex" status

  web:
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.14"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Check
        run: bun run check
      - name: Build
        run: bun run build
