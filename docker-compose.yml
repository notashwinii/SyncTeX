# SyncTeX development environment.
# `docker compose up -d` starts the backing services; run api and web natively
# for hot reload (see README), or `docker compose --profile full up` to run
# everything in containers.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: synctex
      POSTGRES_PASSWORD: synctex
      POSTGRES_DB: synctex
    ports:
      - "5432:5432"
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synctex"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - ./.data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: synctex
      MINIO_ROOT_PASSWORD: synctex-dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./.data/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: create the dev bucket so the api boots without manual setup.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 synctex synctex-dev &&
      mc mb --ignore-existing local/synctex-dev
      "

  migrate:
    profiles: ["full"]
    build: ./apps/api
    command: ["goose", "-dir", "migrations", "up"]
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: postgres://synctex:synctex@postgres:5432/synctex
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    profiles: ["full"]
    build: ./apps/api
    env_file:
      - path: ./apps/api/.env.sample
        required: true
      - path: ./apps/api/.env
        required: false
    environment:
      DB_URI: postgres://synctex:synctex@postgres:5432/synctex
      B2_ENDPOINT: http://minio:9000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    profiles: ["full"]
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api
      NEXT_PUBLIC_WS_URL: ws://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
